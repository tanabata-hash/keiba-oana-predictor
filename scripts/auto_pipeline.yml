name: 自動レース予想・オッズ更新パイプライン (Auto Keiba Pipeline)

on:
  schedule:
    # ① 金曜 18:00 JST (09:00 UTC) - JRA枠順確定後の週末全レース事前予想生成
    - cron: '0 9 * * 5'
    # ② 土曜 08:30 JST (金曜 23:30 UTC) - 土曜朝の最新オッズ・波乱度更新
    - cron: '30 23 * * 5'
    # ③ 日曜 08:30 JST (土曜 23:30 UTC) - 日曜朝（重賞当日）最新オッズ・波乱度更新
    - cron: '30 23 * * 6'
    # ④ 日曜 17:30 JST (08:30 UTC) - 全レース確定着順・的中検証モード更新
    - cron: '30 8 * * 0'
  # GitHub画面のボタンから手動でいつでも即時実行可能
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリのチェックアウト
        uses: actions/checkout@v4

      - name: Python環境のセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 依存パッケージのインストール
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: pipeline.py 自動実行（出馬表・オッズ取得 〜 波乱度・買い目生成）
        run: |
          python pipeline.py

      - name: 更新データの自動コミット＆プッシュ (Vercel自動即時公開へ連携)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/races.json
          if git diff --staged --quiet; then
            echo "変更なし：最新データです。"
          else
            git commit -m "🤖 auto: 週末レース予想・オッズ自動更新 ($(date '+%Y-%m-%d %H:%M:%S'))"
            git push origin main
            echo "✅ GitHubへ自動プッシュ完了！Vercel経由で oana-navi.com へ自動公開されます。"
          fi
